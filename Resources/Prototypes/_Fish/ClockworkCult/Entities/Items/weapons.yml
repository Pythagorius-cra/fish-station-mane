- type: entity
  parent: BaseItem
  id: ClockworkSpear
  name: ratvarian spear
  description: A long brass spear humming with clockwork energy.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/spear.rsi
    state: spear
    color: "#c9a227"
  - type: Item
    size: Large
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 18
        Structural: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: ClockworkArmament

- type: entity
  parent: ClothingOuterBaseLarge
  id: ClothingOuterClockworkArmor
  name: clockwork cuirass
  description: Brass plates that shift and tick like living machinery.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/security.rsi
    color: "#c9a227"
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.7
  - type: ClockworkArmament

- type: entity
  parent: Handcuffs
  id: ClockworkManacles
  name: hateful manacles
  description: Brass restraints that burn with contempt for the unenlightened.
  components:
  - type: Sprite
    color: "#c9a227"
  - type: Handcuff
    breakoutTime: 20
    cuffedRSI: Objects/Misc/handcuffs.rsi
