- type: entity
  id: ClockworkSigilSubmission
  name: sigil of submission
  description: A glowing brass sigil. Victims held upon it can be converted.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Tiles/Misc/clockwork/clockwork_floor_filled.png
    drawdepth: FloorTiles
  - type: Clickable
  - type: InteractionOutline
  - type: ClockworkSigilSubmission
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

