# Fish-start: ядра слаймов SS220. Реакции смотрят на color, оружие ядра не спавнится.
- type: entity
  parent: BaseItem
  id: FishSlimeExtractBase
  abstract: true
  suffix: Fish
  name: slime extract
  description: Goo extracted from a slime. Legends claim it has strange powers.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Fish/Xenobiology/extracts/extracts.rsi
    state: extract
  - type: Solution
    solution:
      maxVol: 100
      canReact: false
  - type: InjectableSolution
    solution: solution
  - type: DrawableSolution
    solution: solution
  - type: ExaminableSolution
    solution: solution
  - type: FishSlimeExtract
    color: grey
    maxUses: 5

- type: entity
  parent: FishSlimeExtractBase
  id: FishSlimeExtractGrey
